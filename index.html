<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fichas de Treino</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light dark;
  --bg:#EEF1F4; --surface:#FFFFFF; --fg:#14181D; --muted:#5E6873; --line:#D8DEE5;
  --claus:#2F55E0; --ana:#0E6E8C;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1216; --surface:#171D24; --fg:#E8ECF0; --muted:#97A2AE; --line:#2A333D;
  --claus:#7D98FF; --ana:#5CC4E6;
}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--body);
  padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto}
h1{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;margin:0;letter-spacing:.5px;text-transform:uppercase}
.sub{color:var(--muted);font-size:14px;margin:8px 0 24px}
.card{--c:var(--claus);position:relative;display:block;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:20px 20px 18px 24px;margin-bottom:14px;color:inherit;text-decoration:none;overflow:hidden;
  transition:transform .12s ease}
.card:active{transform:scale(.98)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.card.ana{--c:var(--ana)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.name{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.5px}
.go{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--surface);display:grid;place-items:center}
.go svg{width:22px;height:22px}
.next{margin-top:14px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.treino{margin-top:4px;font-size:17px;font-weight:600}
.treino small{color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap}
.fila{display:flex;gap:6px;margin-top:14px}
.fila span{flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:18px;padding:6px 0;border-radius:8px;
  border:1px solid var(--line);color:var(--muted)}
.fila span.on{background:var(--c);border-color:var(--c);color:var(--surface)}
.dica{margin-top:22px;padding:14px 16px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-size:13px;line-height:1.5}
.dica b{color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Fichas de Treino</h1>
  <p class="sub">Toque na sua ficha. O próximo treino da fila aparece aqui.</p>
  <div id="cards"></div>
  <div class="dica"><b>Use como app:</b> abra este link no Chrome ou Safari (não dentro do WhatsApp) e toque em <b>“Adicionar à tela inicial”</b>. As séries marcadas ficam salvas neste celular.</div>
</div>
<script>
const FICHAS=[
  {id:"claus",nome:"Claus",chave:"ficha.proximo",T:{
    A:["Superior · pesado","35-40"],B:["Inferior · quadríceps","30-35"],
    C:["Superior · volume","35-40"],D:["Inferior · posterior","30-35"]}},
  {id:"ana",nome:"Ana",chave:"ana.proximo",T:{
    A:["Inferior · glúteo e quadríceps","35-40"],B:["Superior · costas e ombro","35-40"],
    C:["Inferior · glúteo e posterior","35-40"],D:["Superior · costas e abdômen","35-40"]}}
];
const lerProximo=k=>{try{const v=JSON.parse(localStorage.getItem(k));return"ABCD".includes(v)&&v?v:"A"}catch(e){return"A"}};
const SETA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
document.getElementById("cards").innerHTML=FICHAS.map(f=>{
  const p=lerProximo(f.chave),[nome,min]=f.T[p];
  return `<a class="card ${f.id}" href="${f.id}.html">
    <div class="top"><span class="name">${f.nome}</span><span class="go">${SETA}</span></div>
    <div class="next">Próximo treino</div>
    <div class="treino">${p} · ${nome} <small>~${min} min</small></div>
    <div class="fila">${"ABCD".split("").map(k=>`<span class="${k===p?"on":""}">${k}</span>`).join("")}</div>
  </a>`;
}).join("");
</script>
</body>
</html>
